<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kelp UI - {{ title }}</title>
    <style>
	body { font-family: sans-serif; font-size: 0.8em !important; }
        a { color: inherit; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .timeline-list, .file-list { list-style: none; padding: 0; }
        .timeline-list li { margin-bottom: 1em; border-bottom: 1px solid #eee; padding-bottom: 1em; }
        .file-list li { padding: 0.2em 0; }
        .checkin-meta p { margin: 0.2em 0; }
        .uuid { font-family: monospace; color: #555; }
        .tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; }
        .tag-add { background-color: #e6ffed; color: #22863a; }
        .tag-mod { background-color: #fff8e1; color: #b08800; }
        .tag-del { background-color: #ffeef0; color: #d73a49; }
        .diff-table { border-collapse: collapse; width: 100%; font-size: 0.85em; }
        .diff-table td { padding: 2px 8px; vertical-align: top; border-right: 1px solid #ddd; }
        .diff-table pre { margin: 0; }
        .line-num { color: #888; text-align: right; user-select: none; }
        .line-add { background-color: #e6ffed; }
        .line-del { background-color: #ffeef0; }
	    .meta-grid { display: grid; grid-template-columns: 100px 1fr; gap: 5px 10px; margin-bottom: 2em; }
    .meta-grid strong { text-align: right; color: #444; }
    .context-timeline { border: 1px solid #ddd; padding: 1em; margin-bottom: 2em; }
    .context-timeline ul { list-style: none; padding: 0; margin: 0; }
    .context-timeline li { display: flex; gap: 1em; }
    .context-timeline .context-time { color: #666; width: 50px; }
    .context-timeline .context-current { font-weight: bold; background-color: #fff8e1; }
    .timeline-events {
    margin-left: 2em;
    margin-top: 0.5em;
    padding-left: 0.5em;
    border-left: 2px solid #eee;
    }
    .event-link-meta {
    color: #555;
    font-size: 0.9em;
    margin-right: 0.5em;
    }
    .tag-link { /* A new style for the link_type tag */
	    background-color: #f1f8ff;
	    color: #0366d6;
    }
    .file-changes { margin-top: 2em; }
    details { border: 1px solid #ccc; border-radius: 4px; margin-bottom: 1em; }
    summary { cursor: pointer; padding: 0.5em 1em; background-color: #f7f7f7; font-weight: bold; }
    summary:hover { background-color: #eee; }
    .diff-container { padding: 1em; overflow-x: auto; background-color: #fff; }
    .diff-table { border-collapse: collapse; width: 100%; font-size: 0.85em; white-space: pre; }
    .diff-table td { padding: 1px 8px; vertical-align: top; }
    .diff-table .line-num { border-right: 1px solid #ddd; color: #888; text-align: right; user-select: none; }
    </style>
</head>
<body>
    <div class="container">
       <div>
            <a href="{{ url_for('timeline') }}">[Timeline]</a>
            <a href="{{ url_for('event_list_view') }}">[Events]</a>
        </div>

        <h2>{{ title }}</h2>
        <hr>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
